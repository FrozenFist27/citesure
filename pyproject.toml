[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citesure"
version = "0.1.0"
description = "CiteSure - document Q&A with verbatim citations and an evaluation report (demo project)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pdfplumber>=0.11",
    "rank_bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.3"]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["citesure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call a real LLM API (skipped unless CITESURE_LIVE=1 and an API key is set)",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
